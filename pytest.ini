[pytest]
testpaths = tests
python_files = test_*.py
addopts = -v --strict-markers
markers =
    testops_demo: демонстрационный набор для TestOps
    smoke: критический smoke-набор
    regression: регрессионная проверка
    api: проверка API или сервисного слоя
    integration: интеграционная проверка
    e2e: сквозной пользовательский сценарий
    flaky: намеренно нестабильная проверка
    known_defect: проверка известного дефекта
    slow_demo: проверка с демонстрационной задержкой
